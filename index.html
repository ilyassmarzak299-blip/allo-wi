<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allo-wi - تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 350px;
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
            text-align: center;
            border-radius: 4px;
        }
        h1 {
            font-family: cursive;
            margin-bottom: 30px;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1877f2;
        }
        .switch {
            margin-top: 20px;
            font-size: 14px;
            color: #737373;
        }
        .switch a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="loginBox">
        <h1>Allo-wi</h1>
        <form>
            <input type="text" placeholder="اسم المستخدم أو البريد الإلكتروني" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>
        <div class="switch">
            ليس لديك حساب؟ <a href="#" onclick="toggleForm()">إنشاء حساب جديد</a>
        </div>
    </div>

    <div class="container" id="signupBox" style="display: none;">
        <h1>Allo-wi</h1>
        <p style="color: #737373; font-size: 14px;">سجل لترى الصور والمنشورات من أصدقائك.</p>
        <form>
            <input type="email" placeholder="البريد الإلكتروني" required>
            <input type="text" placeholder="الاسم الكامل" required>
            <input type="text" placeholder="اسم المستخدم" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل</button>
        </form>
        <div class="switch">
            لديك حساب بالفعل؟ <a href="#" onclick="toggleForm()">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        function toggleForm() {
            const loginBox = document.getElementById('loginBox');
            const signupBox = document.getElementById('signupBox');
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                signupBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                signupBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
